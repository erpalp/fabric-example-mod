name: Java CI with Gradle

on:
  push:
    branches: [ main, master, 1.21.11 ]
  pull_request:
    branches: [ main, master, 1.21.11 ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'

    - name: Unpack Claudes Mod Structure
      run: |
        # 1. Lösche den alten fehlerhaften com.example Ordner restlos
        rm -rf src/main/java/com
        
        # 2. Suche nach der hochgeladenen ZIP-Datei und entpacke sie direkt auf dem Server
        if ls *.zip 1>/dev/null 2>&1; then
          echo "ZIP-Datei gefunden, entpacke Struktur..."
          unzip -o *.zip
          
          # Falls die ZIP einen Unterordner erzeugt hat, schiebe die Dateien ins Hauptverzeichnis
          if [ -d "markerbox-1.21.11" ]; then
            cp -r markerbox-1.21.11/* .
            rm -rf markerbox-1.21.11
          fi
        else
          echo "Keine ZIP-Datei im Hauptverzeichnis gefunden. Stelle sicher, dass sie hochgeladen wurde!"
        fi
        
    - name: Validate Gradle wrapper
      uses: gradle/actions/wrapper-validation@v4
      
    - name: Setup Gradle Environment
      uses: gradle/actions/setup-gradle@v4
      
    - name: Core Compile and Build
      run: chmod +x gradlew && ./gradlew clean genSources build --no-configuration-cache --no-daemon
      
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: Fabric Mod
        path: build/libs/*.jar
